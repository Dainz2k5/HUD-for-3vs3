<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Arena HUD 4.0 Bilateral</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Teko:wght@500;600&display=swap");
      html,
      body {
        width: 1920px;
        height: 1080px;
        margin: 0;
        background: transparent;
        font-family: "Teko";
        color: white;
        overflow: hidden;
      }

      .hud-main {
        position: absolute;
        top: 40px;
        left: 50%;
        transform: translateX(-50%);
        width: 1840px;
        display: none;
        flex-direction: column;
        gap: 20px;
      }
      .clock {
        font-size: 42px;
        text-align: center;
        color: #c8aa6e;
        border: 1px solid #c8aa6e;
        background: rgba(0, 0, 0, 0.8);
        width: 180px;
        margin: 0 auto;
        padding: 5px;
        border-radius: 4px;
      }

      /* Layout nằm ngang: 3 đội trái, 3 đội phải */
      .bilateral-layout {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 100px;
      }
      .side {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .team-card {
        background: rgba(10, 10, 12, 0.92);
        border: 1px solid #c8aa6e;
        border-radius: 4px;
        padding: 10px;
        box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
      }
      .team-label {
        color: #c8aa6e;
        font-size: 20px;
        border-bottom: 1px solid rgba(200, 170, 110, 0.3);
        margin-bottom: 8px;
      }

      .player-row {
        display: flex;
        align-items: center;
        gap: 12px;
        height: 60px;
        border-bottom: 1px solid #222;
      }

      .avatar-wrap {
        position: relative;
        width: 44px;
        height: 44px;
        flex-shrink: 0;
      }
      .avatar-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border: 1px solid #444;
        border-radius: 4px;
      }
      .avatar-img.dead {
        filter: grayscale(1);
        border-color: red;
      }
      .lvl {
        position: absolute;
        bottom: -4px;
        left: -4px;
        background: #c8aa6e;
        color: black;
        font-weight: bold;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        font-size: 14px;
        text-align: center;
        line-height: 20px;
        border: 1px solid #000;
      }

      .p-info {
        width: 110px;
        line-height: 1;
      }
      .kda {
        color: #e74c3c;
        width: 50px;
        text-align: center;
        font-size: 20px;
      }

      /* KHỐI LÕI NÂNG CẬP (6 ô - 1x6 nằm ngang) */
      .augments-grid {
        display: grid;
        grid-template-columns: repeat(6, 22px);
        grid-template-rows: 22px;
        gap: 3px;
        margin-left: 10px;
      }
      .aug-slot {
        width: 22px;
        height: 22px;
        background: rgba(0, 200, 255, 0.05);
        border: 1px solid rgba(0, 200, 255, 0.3);
        border-radius: 2px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        color: #00d2ff;
      }
      .aug-text {
        font-size: 11px;
        color: #00d2ff;
        text-align: center;
        line-height: 14px;
        max-width: 20px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      /* KHỐI TRANG BỊ (8 ô - 2x4) */
      .items-grid {
        display: grid;
        grid-template-columns: repeat(4, 22px);
        grid-template-rows: repeat(2, 22px);
        gap: 3px;
        margin-left: 20px;
      }
      .item-slot {
        width: 22px;
        height: 22px;
        background: #000;
        border: 1px solid #333;
      }
    </style>
  </head>
  <body>
    <div id="hud" class="hud-main">
      <div class="clock" id="time">00:00</div>
      <div class="bilateral-layout">
        <div class="side" id="left-side"></div>
        <div class="side" id="right-side"></div>
      </div>
    </div>
    <script>
      // OCR queue populated from server-side screenshots
      let OCR_QUEUE = [];
      (async function loadOCR() {
        try {
          const res = await fetch("/api/scan_augments");
          const j = await res.json();
          if (j && j.status === "ok" && j.results) {
            // convert results object to ordered array of cells
            OCR_QUEUE = Object.keys(j.results)
              .map((k) => j.results[k].cells || [])
              .filter((a) => a.length > 0);
          }
        } catch (e) {
          console.warn("OCR load failed", e);
        }
      })();

      const PATCH = "latest";
      setInterval(async () => {
        try {
          const res = await fetch("http://127.0.0.1:5000/api/hud");
          const data = await res.json();
          if (data.status === "in_game") {
            document.getElementById("hud").style.display = "flex";
            const sec = Math.floor(data.time);
            document.getElementById("time").innerText =
              `${Math.floor(sec / 60)}:${(sec % 60).toString().padStart(2, "0")}`;

            const teamKeys = Object.keys(data.teams).sort(
              (a, b) => parseInt(a.split("_")[1]) - parseInt(b.split("_")[1]),
            );
            let leftH = "",
              rightH = "";

            teamKeys.forEach((k, idx) => {
              let pRows = "";
              data.teams[k].forEach((p) => {
                let augs = "",
                  items = "";

                const rawAugments = Array.isArray(p.augments) ? p.augments : [];
                // if no augments provided by API, fall back to OCR queue
                let augTexts = [];
                if (rawAugments.length > 0) {
                  // prefer icon URLs when available
                  // but also capture names for text fallback
                  for (let i = 0; i < rawAugments.length; i++) {
                    augTexts.push(
                      rawAugments[i] &&
                        (rawAugments[i].name || rawAugments[i].id)
                        ? String(rawAugments[i].name || rawAugments[i].id)
                        : "",
                    );
                  }
                } else if (OCR_QUEUE.length > 0) {
                  augTexts = OCR_QUEUE.shift();
                }

                for (let i = 0; i < 6; i++) {
                  const a = rawAugments[i];
                  const augImgUrl = a && a.icon ? a.icon : "";
                  const augText = augTexts && augTexts[i] ? augTexts[i] : "";
                  if (augImgUrl) {
                    augs += `<div class="aug-slot"><img src="${augImgUrl}" style="width: 100%; height:100%; border-radius: 2px;" onerror="this.style.opacity=0"></div>`;
                  } else if (augText) {
                    augs += `<div class="aug-slot"><div class="aug-text">${augText}</div></div>`;
                  } else {
                    augs += `<div class="aug-slot"></div>`;
                  }
                }

                const itemMap = {};
                if (Array.isArray(p.items)) {
                  p.items.forEach((it) => {
                    if (it && typeof it.slot === "number") {
                      itemMap[it.slot] = it;
                    }
                  });
                }

                for (let i = 0; i < 6; i++) {
                  const item = itemMap[i];
                  const itemImgUrl = item && item.icon ? item.icon : "";
                  items += `<div class="item-slot">${itemImgUrl ? `<img src="${itemImgUrl}" style="width: 100%; height:100%; border-radius: 2px;" onerror="this.style.opacity=0">` : ""}</div>`;
                }

                // summoner spells will be shown next to avatar
                const s1_url =
                  p.summoners && p.summoners[0] ? p.summoners[0] : "";
                const s2_url =
                  p.summoners && p.summoners[1] ? p.summoners[1] : "";

                pRows += `<div class="player-row">
                                <div style="display:flex;flex-direction:column;gap:2px;">
                                  <div style="font-size:16px;width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${p.champion}</div>
                                  <div style="font-size:11px;color:#888;width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${p.name}</div>
                                </div>
                                <div class="avatar-wrap">
                                  <img class="avatar-img ${p.is_dead ? "dead" : ""}" src="${p.avatar}" onerror="this.style.opacity=0" alt="">
                                  <div class="lvl">${p.level}</div>
                                </div>
                                <div class="augments-grid">${augs}</div>
                                <div style="display:flex;flex-direction:column;gap:3px;margin-left:4px;">
                                  <div style="width:20px;height:20px">${s1_url ? `<img src="${s1_url}" style="width:100%;height:100%;border-radius:2px;" onerror="this.style.opacity=0">` : ""}</div>
                                  <div style="width:20px;height:20px">${s2_url ? `<img src="${s2_url}" style="width:100%;height:100%;border-radius:2px;" onerror="this.style.opacity=0">` : ""}</div>
                                </div>
                                <div class="kda">${p.kills}/${p.deaths}</div>
                                <div class="items-grid">${items}</div>
                            </div>`;
              });
              let card = `<div class="team-card"><div class="team-label">TEAM ${idx + 1}</div>${pRows}</div>`;
              if (idx < 3) leftH += card;
              else rightH += card;
            });
            document.getElementById("left-side").innerHTML = leftH;
            document.getElementById("right-side").innerHTML = rightH;
          }
        } catch (e) {}
      }, 1000);
    </script>
  </body>
</html>
